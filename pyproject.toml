[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docsearch"
version = "0.1.0"
description = "DocSearch: Dependency-Guided Bi-Level Search for Agent-Oriented Documentation Generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Yutong Cheng" },
]
dependencies = [
    "coverage>=7.4",
    "pytest>=7.4",
    "openai>=1.40",
    "anthropic>=0.39",
    "google-generativeai>=0.7",
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "javalang>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]
